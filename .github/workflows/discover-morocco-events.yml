name: Discover Moroccan Events

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/discover-morocco-events.yml'
      - 'scripts/discover-morocco-events.mjs'
  schedule:
    - cron: '37 7 * * *'

permissions:
  contents: write

concurrency:
  group: discover-morocco-events
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Find and validate event listings
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
        run: node scripts/discover-morocco-events.mjs
      - name: Publish public listings and review candidates
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/event-discovery.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh discovered Moroccan events'
          git pull --rebase origin main
          git push origin HEAD:main
