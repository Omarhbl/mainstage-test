name: Sync Ticket.ma Morocco Events

on:
  workflow_dispatch:
  # Hosted browser tested on 2026-11-14: Ticket.ma returned HTTP 403.
  # Keep manual-only until automated access is available.

permissions:
  contents: write

concurrency:
  group: sync-ticket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - name: Install public-page reader
        run: |
          npm install --prefix "$RUNNER_TEMP/ticket-browser" --no-audit --no-fund playwright@1.64.1
          "$RUNNER_TEMP/ticket-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Read public Ticket.ma catalogue
        env:
          PLAYWRIGHT_PACKAGE_ROOT: ${{ runner.temp }}/ticket-browser
        run: node scripts/sync-ticket-events.mjs
      - name: Publish catalogue
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/ticket-events.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update Ticket.ma Morocco event catalogue'
          git pull --rebase origin main
          git push origin HEAD:main
